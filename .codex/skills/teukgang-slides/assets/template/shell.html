<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特講_TITLE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Segoe UI",sans-serif;background:#20223b;color:#eee}header{padding:12px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}header strong{margin-right:auto}button,select,label.file{font:inherit;background:#363951;border:1px solid #5e617b;color:white;border-radius:6px;padding:8px 11px;cursor:pointer}button:hover,label.file:hover{background:#595078}button[aria-pressed=true]{background:#6450dc}#stage{position:relative;margin:0 auto;background:#f9f8f3;overflow:hidden;box-shadow:0 10px 40px #1116}iframe{position:absolute;border:0;width:1280px;height:720px;transform-origin:top left}#notes{max-width:1100px;margin:24px auto;padding:25px 32px;background:#fff;color:#20223b;border-radius:12px;font-size:19px;line-height:1.9}#notes h2{font-size:23px;margin-top:0}#notes[hidden]{display:none}#status{text-align:center;font-size:13px;color:#c1bfd5;padding:14px}input[type=file]{display:none}#progress{height:3px;background:#c6e884;transition:width .15s}.print-pages{display:none}@media print{body{background:white}header,#stage,#notes,#status,#progress{display:none!important}.print-pages{display:block}.print-pages iframe{position:relative;display:block;transform:none;break-after:page}@page{size:1280px 720px;margin:0}}
body{background:#fff;color:#111}button,select,label.file{background:#fff;color:#111;border:1px solid #111}button:hover,button[aria-pressed=true]{background:#111;color:#fff}#stage{background:#fff;box-shadow:none;outline:1px solid #111}#status{color:#111}#progress{background:#111}</style></head><body>
<header><strong>特講_TITLE</strong><button id="prev" aria-label="이전 슬라이드">←</button><select id="nav" aria-label="슬라이드 선택"></select><button id="next" aria-label="다음 슬라이드">→</button><button id="noteBtn" aria-pressed="false">발표자 노트 N</button><button id="full">전체화면 F</button><button id="edit" aria-pressed="false">문구 편집</button><button id="save">수정 HTML 저장</button><button id="json">JSON 내보내기</button><label class="file">JSON 불러오기<input id="import" type="file" accept="application/json,.json"></label></header>
<div id="progress"></div><main id="stage"><iframe id="slide" title="강의 슬라이드" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></main><div id="status"></div><aside id="notes" hidden><h2></h2><div></div></aside>
<script id="slide-room-project" type="application/json">__PROJECT_DATA__</script>
<script>
let project=JSON.parse(document.getElementById('slide-room-project').textContent),index=0,editing=false;
const $=s=>document.querySelector(s), frame=$('#slide');
function resize(){let w=Math.min(innerWidth-32,1440);const available=innerHeight-$('header').offsetHeight-65;if($('#notes').hidden)w=Math.min(w,available*16/9);w=Math.max(280,w);$('#stage').style.width=w+'px';$('#stage').style.height=w*9/16+'px';frame.style.transform=`scale(${w/1280})`;}
function fillNav(){$('#nav').innerHTML='';project.slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' · '+s.name;$('#nav').append(o)});}
function sync(){if(editing&&frame.contentDocument){frame.contentDocument.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));project.slides[index].html='<!doctype html>'+frame.contentDocument.documentElement.outerHTML;applyEdit();}}
function applyEdit(){if(!frame.contentDocument)return;frame.contentDocument.querySelectorAll('h1,h3,p,.quote,.hero,.band,td,th,.step,.pill,.tag,.desk-label,.papers>div,.cycle>div,.memory-stack>div,.dialogue>div,.services>div,.party-top,.final-map span,.final-map b,.prompt').forEach(e=>{if(editing)e.setAttribute('contenteditable','true');else e.removeAttribute('contenteditable')});}
function show(n){sync();index=Math.max(0,Math.min(n,project.slides.length-1));const s=project.slides[index];frame.srcdoc=s.html;$('#nav').value=index;$('#notes h2').textContent=`${index+1}. ${s.name} · ${s.range||''}`;$('#notes div').textContent=s.notes||'';$('#status').textContent=`${index+1} / ${project.slides.length}　 ·　 ${s.range||''}　 |　 ← → 슬라이드 · Shift+← → 애니메이션 · N 노트 · F 전체화면${editing?'　 |　 문구를 클릭해 수정한 뒤 HTML로 저장하세요':''}`;$('#progress').style.width=((index+1)/project.slides.length*100)+'%';resize();}
function keys(e){if(e.target.closest&&e.target.closest('[contenteditable=true],input,textarea,select'))return;if(e.shiftKey&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();e.stopPropagation();const direction=e.key==='ArrowRight'?'next':'previous';frame.contentDocument?.querySelector('[data-motion-direction='+direction+']')?.click();return;}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')full();}
frame.addEventListener('load',()=>{applyEdit();frame.contentDocument.addEventListener('keydown',keys)});
$('#prev').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);$('#nav').onchange=e=>show(Number(e.target.value));
function toggleNotes(){$('#notes').hidden=!$('#notes').hidden;$('#noteBtn').setAttribute('aria-pressed',String(!$('#notes').hidden));resize()}
$('#noteBtn').onclick=toggleNotes;function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}$('#full').onclick=full;
$('#edit').onclick=()=>{sync();editing=!editing;$('#edit').setAttribute('aria-pressed',String(editing));applyEdit();$('#status').textContent=editing?'편집 모드 · 제목, 본문, 표 셀을 클릭하세요. 수정 후 HTML 저장을 누르세요.':'편집 종료 · 변경 내용을 보존하려면 수정 HTML 저장을 누르세요.'};
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
$('#json').onclick=()=>{sync();download('강의-편집본.json',JSON.stringify(project,null,2),'application/json')};
$('#save').onclick=()=>{sync();const clone=document.documentElement.cloneNode(true);clone.querySelector('#slide-room-project').textContent=JSON.stringify(project).replace(/</g,'\\u003c');clone.querySelector('#slide').removeAttribute('srcdoc');clone.querySelector('#notes').hidden=true;clone.querySelectorAll('button[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed','false'));download('강의-편집본.html','<!doctype html>'+clone.outerHTML,'text/html')};
$('#import').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());if(p.version!==1||!Array.isArray(p.slides)||!p.slides.length||p.slides.some(s=>typeof s.html!=='string'))throw Error();editing=false;project=p;index=0;$('#edit').setAttribute('aria-pressed','false');fillNav();show(0)}catch{$('#status').textContent='불러오기 실패: version 1 형식의 슬라이드 JSON을 선택하세요.'}e.target.value=''};
document.addEventListener('keydown',keys);window.addEventListener('resize',resize);fillNav();show(0);
</script></body></html>
